[package]
name = "h3-quinn"
version = "0.0.10"
rust-version = "1.70"
authors = ["Jean-Christophe BEGUE <jc.begue@pm.me>"]
edition = "2021"
documentation = "https://docs.rs/h3-quinn"
repository = "https://github.com/hyperium/h3"
readme = "README.md"
description = "QUIC transport implementation based on Quinn."
keywords = ["http3", "quic", "h3"]
categories = ["network-programming", "web-programming"]
license = "MIT"

[dependencies]
h3 = { version = "0.0.8" }
bytes = "1"
# The application selects the runtime and crypto backend.
quinn = { version = "0.11.7", default-features = false }
futures = { version = "0.3.28" }
h3-datagram = {version = "0.0.2", optional = true }
tracing = { version = "0.1.40", optional = true }

[features]
tracing = ["dep:tracing"]
datagram = ["dep:h3-datagram"]
