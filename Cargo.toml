[package]
name = "ai-edge-gateway"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = ["websocket", "mimalloc"]
websocket = ["tokio/io-util", "dep:base64"]
mimalloc = ["dep:mimalloc"]
# The release-specific filter takes precedence over the general filter.
quiet = ["tracing/max_level_off", "tracing/release_max_level_off"]

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "signal", "macros", "sync"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server-auto"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
h3 = { version = "0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"
socket2 = { version = "0.6", features = ["all"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["system-config", "tokio"] }
tower-service = "0.3"
arc-swap = "1"
mimalloc = { version = "0.1", optional = true, default-features = false }
toml = { version = "1", default-features = false, features = ["serde", "parse"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
zeroize = "1"
# Compile out dependency TRACE/DEBUG callsites in optimized builds without losing INFO/WARN/ERROR.
tracing = { version = "0.1", default-features = false, features = ["std", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
base64 = { version = "0.22", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
if-addrs = "0.15"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Use `cargo build-native` (see .cargo/config.toml) to add target-cpu=native.
# Keep machine-specific artifacts separate from the portable release.
[profile.release-native]
inherits = "release"

[profile.release-min]
inherits = "release"
opt-level = "z"

[patch.crates-io]
h3 = { path = "vendor/h3" }
h3-quinn = { path = "vendor/h3-quinn" }
quinn = { path = "vendor/quinn" }
quinn-proto = { path = "vendor/quinn-proto" }
